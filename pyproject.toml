[project]
name = "surface-temps"
version = "0.1.0"
description = "Frequency-domain admittance method for outdoor surface temperatures"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.7",
    "numba>=0.65.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "pillow>=12.2.0",
    "pvlib>=0.11",
    "pyviewfactor>=1.0.3",
    "pyvista>=0.48.4",
    "tqdm>=4.67.3",
]

[tool.setuptools.packages.find]
include = ["surface_temps*", "examples*"]

[project.scripts]
surface-temps = "examples.neighborhood:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
